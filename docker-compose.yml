# Lokalny Postgres do developmentu. Na produkcji: Postgres z Railway.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent
      POSTGRES_DB: jobagent
    ports:
      # 5433, zeby nie kolidowac z Postgresem zainstalowanym lokalnie
      - '5433:5432'
    volumes:
      - jobagent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobagent -d jobagent']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobagent-pgdata:
